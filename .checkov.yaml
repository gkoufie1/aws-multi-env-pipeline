# Inline `# checkov:skip=` comments don't get attributed correctly for
# resources defined inside a module (known checkov limitation when scanning
# from a calling directory), so the actual suppressions live here. The
# reasoning for each is still documented as a comment directly above the
# resource in modules/vpc-baseline/main.tf — this file is just what
# actually makes checkov respect it.
skip-check:
  - CKV_AWS_130  # public subnets ARE meant to auto-assign public IPs — that's the point
  - CKV2_AWS_5   # baseline SG intentionally unattached — no compute deployed into this network yet
  - CKV_AWS_18   # S3 access logging needs a 2nd bucket — not worth it for an empty baseline bucket
  - CKV_AWS_144  # S3 cross-region replication — real ongoing cost, nothing worth replicating yet
  - CKV_AWS_145  # S3 SSE-KMS — SSE-S3 (AES256) is free and sufficient at this scope
  - CKV2_AWS_62  # S3 event notifications — no Lambda/SQS/SNS consumer exists to notify
  - CKV_AWS_158  # CloudWatch Log Group KMS encryption — default AWS-managed encryption is sufficient for flow log metadata
